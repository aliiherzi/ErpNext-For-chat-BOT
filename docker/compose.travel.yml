services:
  backend: {image: "erpnext-local:latest", pull_policy: never}
  configurator: {image: "erpnext-local:latest", pull_policy: never}
  create-site: {image: "erpnext-local:latest", pull_policy: never}
  frontend: {image: "erpnext-local:latest", pull_policy: never}
  queue-long: {image: "erpnext-local:latest", pull_policy: never}
  queue-short: {image: "erpnext-local:latest", pull_policy: never}
  scheduler: {image: "erpnext-local:latest", pull_policy: never}
  websocket: {image: "erpnext-local:latest", pull_policy: never}
  frontend-travel:
    image: erpnext-local:latest
    pull_policy: never
    networks:
      - frappe_network
    depends_on:
      - websocket
      - backend
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: travel.localhost
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8081:8080"

